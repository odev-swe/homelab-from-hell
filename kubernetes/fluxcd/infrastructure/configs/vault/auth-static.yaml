#! cert-manager
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: cloudflare-static-auth
  namespace: cert-manager 
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: k8s-role
    serviceAccount: cert-manager
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare-api-token-secret
  namespace: cert-manager
spec:
  type: kv-v2 

  # mount path
  mount: kvv2

  # path of the secret
  path: cert-manager

  # dest k8s secret
  destination:
    name: cloudflare-api-token-secret
    create: true

  # static secret refresh interval
  refreshAfter: 30s

  # Name of the CRD to authenticate to Vault
  vaultAuthRef: cloudflare-static-auth