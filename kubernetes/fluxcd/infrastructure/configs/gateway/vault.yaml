# gateway
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vault-gateway
  namespace: hashicorp-vault
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-dns
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: vault.porkbunlab.com
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: vault-tls
        mode: Terminate
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-route
  namespace: hashicorp-vault
spec:
  parentRefs:
    - name: vault-gateway
      namespace: hashicorp-vault
  hostnames:
    - vault.porkbunlab.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /ui
      backendRefs:
        - name: hashicorp-vault
          port: 8200
          namespace: hashicorp-vault