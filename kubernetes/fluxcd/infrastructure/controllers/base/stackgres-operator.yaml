apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stackgres-operator 
  namespace: stackgres
spec:
  interval: 24h
  url: https://stackgres.io/downloads/stackgres-k8s/stackgres/helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stackgres-operator 
  namespace: stackgres 
spec:
  interval: 30m
  chart:
    spec:
      chart: stackgres-operator
      version: "1.18.3"
      sourceRef:
        kind: HelmRepository
        name: stackgres-operator
        namespace: stackgres
      interval: 12h