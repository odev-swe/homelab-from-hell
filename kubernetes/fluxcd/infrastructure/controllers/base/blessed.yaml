apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: blessed
  namespace: blessed
spec:
  image: ghcr.io/odev-swe/charts/blessed-helm-chart
  interval: 24h
  secretRef:
    name: ghcr-secret
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: blessed
  namespace: blessed
spec:
  imageRepositoryRef:
    name: blessed
  # filterTags:
  #   pattern: "^0.x-.*"
  policy:
    semver:
      # image semver will be like 1.0.0
      range: "1.x"
