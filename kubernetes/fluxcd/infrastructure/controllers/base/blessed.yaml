apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: blessed
  namespace: blessed
spec:
  interval: 24h
  type: oci
  url: oci://ghcr.io/odev-swe/charts/blessed-helm-chart
  secretRef:
    name: ghcr-secret
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blessed
  namespace: blessed
spec:
  interval: 30m
  chart:
    spec:
      chart: blessed-helm-chart
      version: "0.1.0-015d52c"
      sourceRef:
        kind: HelmRepository
        name: blessed
        namespace: blessed
      interval: 12h
