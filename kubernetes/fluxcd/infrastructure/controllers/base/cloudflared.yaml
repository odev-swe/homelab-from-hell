apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: community-charts
  namespace: cloudflared
spec:
  interval: 24h
  url: https://cloudflare.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  suspend: false
  interval: 30m
  chart:
    spec:
      chart: cloudflared
      version: "2.2.5"
      sourceRef:
        kind: HelmRepository
        name: community-charts
        namespace: cloudflared
      interval: 12h
      
      
