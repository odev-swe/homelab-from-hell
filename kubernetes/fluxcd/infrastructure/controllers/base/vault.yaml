apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hashicorp
  namespace: hashicorp-vault
spec:
  interval: 24h
  url: https://helm.releases.hashicorp.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hashicorp-vault
  namespace: hashicorp-vault
spec:
  suspend: false
  interval: 30m
  chart:
    spec:
      chart: vault
      version: "0.32.0"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: hashicorp-vault
      interval: 12h
  values:
    server:
      ha:
        enabled: true
        replicas: 2

        raft:
          enabled: true
          setNodeId: true

      dataStorage:
        enabled: true
        size: 10Gi
        storageClass: nfs-vault-csi

      auditStorage:
        enabled: true
        size: 10Gi
        storageClass: nfs-vault-csi