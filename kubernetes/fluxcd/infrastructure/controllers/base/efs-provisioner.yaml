apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-nfs-driver
  namespace: kube-system
spec:
  interval: 24h
  url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-nfs-driver
  namespace: kube-system
spec:
  suspend: false
  interval: 30m
  chart:
    spec:
      chart: csi-driver-nfs
      version: "4.12.0"
      sourceRef:
        kind: HelmRepository
        name: csi-nfs-driver
        namespace: kube-system
      interval: 12h