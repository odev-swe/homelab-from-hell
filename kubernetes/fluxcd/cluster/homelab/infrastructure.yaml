apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./kubernetes/fluxcd/infrastructure/controllers/overlay"
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 1h
  retryInterval: 1m
  timeout: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./kubernetes/fluxcd/infrastructure/configs"
  prune: true
  wait: true