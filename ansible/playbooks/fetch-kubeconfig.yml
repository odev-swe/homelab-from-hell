---
- name: Fetch and Configure Kubeconfig
  hosts: k8s_master
  become: false
  gather_facts: false # Faster, we just need ansible_host which is in inventory
  
  tasks:
    - name: Fetch kubeconfig from master to temporary location
      ansible.builtin.fetch:
        src: /home/masternode/.kube/config
        dest: /tmp/rke2-kubeconfig
        flat: yes

    - name: Update server IP in kubeconfig
      delegate_to: localhost
      ansible.builtin.replace:
        path: /tmp/rke2-kubeconfig
        regexp: '127\.0\.0\.1'
        replace: "{{ ansible_host }}"

    - name: Ensure ~/.kube directory exists locally
      delegate_to: localhost
      ansible.builtin.file:
        path: ~/.kube
        state: directory
        mode: '0700'

    - name: Check if ~/.kube/config exists
      delegate_to: localhost
      ansible.builtin.stat:
        path: ~/.kube/config
      register: kubeconfig_stat

    - name: Backup existing kubeconfig
      delegate_to: localhost
      ansible.builtin.copy:
        src: ~/.kube/config
        dest: "~/.kube/config.bak.{{ ansible_date_time.iso8601 | default('old') }}"
        mode: '0600'
      when: kubeconfig_stat.stat.exists

    - name: Install new kubeconfig to ~/.kube/config
      delegate_to: localhost
      ansible.builtin.copy:
        src: /tmp/rke2-kubeconfig
        dest: ~/.kube/config
        mode: '0600'

    - name: Display success message
      delegate_to: localhost
      ansible.builtin.debug:
        msg: "Kubeconfig has been fetched and installed to ~/.kube/config. Previous config backed up."
